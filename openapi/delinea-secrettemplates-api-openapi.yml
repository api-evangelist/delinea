    post:
      tags:
      - SecretTemplates
      summary: Create a Secret Template Launcher
      description: Create a Launcher for a Secret Template
      operationId: SecretTemplatesService_CreateSecretTemplateLauncher
      parameters:
      - name: launcherTypeId
