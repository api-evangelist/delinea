                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/secret-templates:
    get:
      tags:
      - SecretTemplates
      summary: Search Secret Templates
      description: Search, filter, sort, and page secret templates
      operationId: SecretTemplatesService_Search
      parameters:
      - name: filter.heartbeatEnabled
        in: query
        description: Filter templates that have heartbeat enabled or disabled
        required: false
        x-nullable: true
        schema:
          type: string
      - name: filter.includeInactive
        in: query
        description: Whether to include inactive secret templates in the results
        required: false
        schema:
          type: boolean
      - name: filter.includeSecretCount
        in: query
        description: Whether to populate Secret count in the results
        required: false
        schema:
          type: boolean
      - name: filter.passwordTypeIds
        in: query
        description: List of Password Type Ids
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filter.passwordTypeReady
        in: query
        description: Filter templates that are either password type ready (enabled) or not (disabled)
        required: false
        x-nullable: true
        schema:
          type: string
      - name: filter.scanItemTemplateId
        in: query
        description: 'Filter templates that map to '
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.searchText
        in: query
        description: Search text
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Secret template search result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfSecretTemplateSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    post:
      tags:
      - SecretTemplates
      summary: Create Secret Template
      description: Create a new Secret Template
      operationId: SecretTemplatesService_CreateTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretTemplateCreateArgs'
        description: Secret Template creation options
      responses:
        '200':
          description: Secret Template object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTemplateModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
