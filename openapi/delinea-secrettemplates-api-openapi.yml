        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Delete success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTemplateLauncherDeleteResultModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    patch:
      tags:
      - SecretTemplates
      summary: Update a Secret Template Launcher
      description: Update a Launchers for a Secret Template
      operationId: SecretTemplatesService_UpdateSecretTemplateLauncher
      parameters:
      - name: launcherTypeId
        in: path
        description: launcherTypeId
        required: true
        schema:
          type: integer
          format: int32
      - name: secretTemplateId
        in: path
        description: secretTemplateId
        required: true
        schema:
