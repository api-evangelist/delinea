openapi: 3.0.0
info:
  title: Secret Server Rest Activations SecretTemplates API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: SecretTemplates
  description: View secret templates
paths:
  /v1/secret-templates/fields/{templateFieldId}:
    delete:
      tags:
      - SecretTemplates
      summary: Disable a Secret Template Field For Template
      description: Disable a Secret Template Field For Template
      operationId: SecretTemplatesService_DisableField
      parameters:
      - name: templateFieldId
        in: path
        description: Secret Template Field to disable
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Secret Template Field object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTemplateField'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/secret-templates/password-requirements/password-dictionaries/{id}:
    get:
      tags:
      - SecretTemplates
      summary: Gets password dictionary items by ID
      description: Returns a file containing the items of a specific custom password dictionary.
      operationId: SecretTemplatesService_GetPasswordDictionary
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Unknown or empty response
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    delete:
      tags:
      - SecretTemplates
      summary: Deletes a specific password dictionary by ID
      description: Deletes a specific custom password dictionary with the contents.
      operationId: SecretTemplatesService_DeletePasswordDictionary
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: 'true'
          content:
            application/json:
              schema:
                description: Boolean
                type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/secret-templates/{secretTemplateId}/extended-mappings/{extendedTypeId}:
    get:
      tags:
      - SecretTemplates
      summary: Get a single Secret Template Extended Mappings
      description: Get an extended mapping for a Secret Template
      operationId: SecretTemplatesService_GetSecretTemplateExtendedMapping
      parameters:
      - name: extendedTypeId
        in: path
        description: extendedTypeId
        required: true
        schema:
          type: integer
          format: int32
      - name: secretTemplateId
        in: path
        description: secretTemplateId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Extended Mapping Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTemplateExtendedMappingModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    post:
      tags:
      - SecretTemplates
      summary: Create a Secret Template Extended Mapping
      description: Create an extended mappings for a Secret Template
      operationId: SecretTemplatesService_CreateSecretTemplateExtendedMapping
      parameters:
      - name: extendedTypeId
        in: path
        description: extendedTypeId
        required: true
        schema:
          type: integer
          format: int32
      - name: secretTemplateId
        in: path
        description: secretTemplateId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretTemplateExtendedMappingCreateArgs'
        description: args
      responses:
        '200':
          description: Created extended mappings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTemplateExtendedMappingModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    delete:
      tags:
      - SecretTemplates
      summary: Delete Extended Mapping
      description: Delete an extended mapping
      operationId: SecretTemplatesService_DeleteExtendedMapping
      parameters:
      - name: extendedTypeId
        in: path
        description: extendedTypeId
        required: true
        schema:
          type: integer
          format: int32
      - name: secretTemplateId
        in: path
        description: secretTemplateId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTemplateExtendedMappingDeleteResponseModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    patch:
      tags:
      - SecretTemplates
      summary: Update a Secret Template Extended Mapping
      description: Update extended mappings for a Secret Template
      operationId: SecretTemplatesService_UpdateSecretTemplateExtendedMapping
      parameters:
      - name: extendedTypeId
        in: path
        description: extendedTypeId
        required: true
        schema:
          type: integer
          format: int32
      - name: secretTemplateId
        in: path
        description: secretTemplateId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretTemplateExtendedMappingUpdateArgs'
        description: args
      responses:
        '200':
          description: List of extended mappings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretTemplateExtendedMappingModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/secret-templates/{secretTemplateId}/launchers/{launcherTypeId}:
