openapi: 3.0.0
info:
  title: Secret Server Rest Activations JumpboxRoute API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: JumpboxRoute
  description: JumpboxRouteController
paths:
  /v1/jumpbox-route/{id}/level/{order}:
    delete:
      tags:
      - JumpboxRoute
      summary: Delete JumpboxRoute Level
      description: Delete a Jumpbox Route Level on a Jumpbox Route
      operationId: JumpboxRouteService_DeleteJumpboxRouteLevel
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
          format: uuid
      - name: order
        in: path
        description: order
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Boolean
          content:
            application/json:
              schema:
                description: Boolean
                type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    patch:
      tags:
      - JumpboxRoute
      summary: Edit JumpboxRoute Level
      description: Edit a Jumpbox Route Level
      operationId: JumpboxRouteService_PatchJumpboxRouteLevel
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
          format: uuid
      - name: order
        in: path
        description: order
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JumpboxRouteLevelPatchArgs'
        description: args
      responses:
        '200':
          description: JumpboxRouteLevel Summary Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JumpboxRouteLevelSummaryModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/jumpbox-route/search:
    get:
      tags:
      - JumpboxRoute
      summary: Search JumpboxRoutes
      description: Search, filter, sort, and page Jumpbox routes
      operationId: JumpboxRouteService_Search
      parameters:
      - name: filter.includeActive
        in: query
        description: IncludeActive
        required: false
        schema:
          type: boolean
      - name: filter.includeInactive
        in: query
        description: IncludeInactive
        required: false
        schema:
          type: boolean
      - name: filter.searchTerm
        in: query
        description: SearchTerm
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: JumpboxRoute search result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfJumpboxRouteSummaryModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/jumpbox-route/user:
    get:
      tags:
      - JumpboxRoute
      summary: Get Jumpbox Routes visible to a user
      description: Get an array of Jumpbox Routes that are visible to a specific user
      operationId: JumpboxRouteService_GetAllRoutesForUser
      parameters:
      - name: filter.includeActive
        in: query
        description: IncludeActive
        required: false
        schema:
          type: boolean
      - name: filter.includeInactive
        in: query
        description: IncludeInactive
        required: false
        schema:
          type: boolean
      - name: filter.searchTerm
        in: query
        description: SearchTerm
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Jumpbox Route Summary Model paging object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfJumpboxRouteSummaryModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/jumpbox-route/{id}:
    get:
      tags:
      - JumpboxRoute
      summary: Find JumpboxRoute
      description: Find a Jumpbox Route by Id
      operationId: JumpboxRouteService_Get
      parameters:
      - name: id
        in: path
        description: Jumpbox Route Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: JumpboxRoute detail object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JumpboxRouteModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    patch:
      tags:
      - JumpboxRoute
      summary: Udpate a Jumpbox Route
      description: Update an existing Jumpbox Route using the existing Jumpbox Route's ID
      operationId: JumpboxRouteService_UpdateJumpboxRoute
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JumpboxRoutePatchArgs'
        description: jumpboxRouteUpdateArgs
      responses:
        '200':
          description: JumpboxRoute Summary Object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JumpboxRouteSummaryModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/jumpbox-route/{id}/audit:
    get:
      tags:
      - JumpboxRoute
      summary: Get Jumpbox Route Audits
      description: Retrieve audits for the Jumpbox Routes
      operationId: JumpboxRouteService_GetJumpboxAudits
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: string
          format: uuid
      - name: isExporting
        in: query
        description: isExporting
        required: false
        schema:
          type: boolean
      - name: filter.searchTerm
        in: query
        description: SearchTerm
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
