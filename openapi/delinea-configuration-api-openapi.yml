  /v1/configuration/audit:
    get:
      tags:
      - Configuration
      summary: Audit of system configuration changes
      description: Audit of system configuration changes
      operationId: ConfigurationService_GetConfigurationAudit
      parameters:
      - name: isExporting
        in: query
        description: isExporting
        required: false
        schema:
          type: boolean
      - name: filter.searchTerm
        in: query
        description: SearchTerm
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Configuration audit items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfConfigurationAuditItem'
        '400':
          description: Bad request
          content:
            application/json:
