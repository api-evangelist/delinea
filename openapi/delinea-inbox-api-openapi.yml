openapi: 3.0.0
info:
  title: Secret Server Rest Activations Inbox API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: Inbox
  description: InboxController
paths:
  /v1/inbox/templates/resources/{id}:
    get:
      tags:
      - Inbox
      summary: Get inbox resource
      description: Get inbox resource
      operationId: InboxService_GetResource
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Inbox Resource Data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResourceData'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    delete:
      tags:
      - Inbox
      summary: Delete inbox resource
      description: Delete inbox resource
      operationId: InboxService_DeleteResource
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResourceDeleteResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/inbox/messages/{messageTypeId?}:
    get:
      tags:
      - Inbox
      summary: Search inbox messages
      description: Search, filter, sort, and page inbox messages
      operationId: InboxService_SearchInboxMessages
      parameters:
      - name: messageTypeId
        in: query
        description: messageTypeId
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.endDate
        in: query
        description: EndDate
        required: false
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: messageDataFilters[0].displayValue
        in: query
        description: Search specifically display values
        required: false
        schema:
          type: string
      - name: messageDataFilters[0].inboxDataName
        in: query
        description: Which field is being searched
        required: false
        schema:
          type: string
      - name: messageDataFilters[0].valueBool
        in: query
        description: Search specifically for boolean values
        required: false
        x-nullable: true
        schema:
          type: boolean
      - name: messageDataFilters[0].valueDateTimeEnd
        in: query
        description: Search specifically for date values less than this date
        required: false
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: messageDataFilters[0].valueDateTimeStart
        in: query
        description: Search specifically for date values greater than this date
        required: false
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: messageDataFilters[0].valueInt
        in: query
        description: Search specifically for int values
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: messageDataFilters[0].valueString
        in: query
        description: Search specifically for string values
        required: false
        schema:
          type: string
      - name: filter.messageTypeIds
        in: query
        description: MessageTypeIds
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filter.readStatusFilter
        in: query
        description: ReadStatusFilter
        required: false
        schema:
          type: string
      - name: filter.startDate
        in: query
        description: StartDate
        required: false
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Inbox Message results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfInboxMessageSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
