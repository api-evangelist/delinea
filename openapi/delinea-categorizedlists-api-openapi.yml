  /v1/lists/{categorizedListId}/audits:
    get:
      tags:
      - CategorizedLists
      summary: Get Audits for List
      description: Search, filter, sort, and page List Audits.
      operationId: CategorizedListsService_SearchListAudit
      parameters:
      - name: categorizedListId
        in: path
        description: List Id
        required: true
        schema:
          type: string
          format: uuid
      - name: isExporting
        in: query
        description: isExporting
        required: false
        schema:
          type: boolean
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A paginated list of Audits for List.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfCategorizedListAuditModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/lists/{categorizedListId}/options/single:
    put:
      tags:
      - CategorizedLists
      summary: Updates an option in a list
      description: Updates an option in the list with the provided ID
      operationId: CategorizedListsService_UpdateItemInList
      parameters:
      - name: categorizedListId
