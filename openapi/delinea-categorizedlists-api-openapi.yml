        description: List option to be added
      responses:
        '200':
          description: The new option in the list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfCategorizedListItemViewModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
