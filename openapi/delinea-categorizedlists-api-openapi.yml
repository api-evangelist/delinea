  /v1/lists/{categorizedListId}/options/replace:
    put:
      tags:
      - CategorizedLists
      summary: Replaces options in a list
      description: Replaces all options currently in the list with the given options
      operationId: CategorizedListsService_ReplaceItemsInList
      parameters:
      - name: categorizedListId
        in: path
        description: List ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        $ref: '#/components/requestBodies/CategorizedListItemCreateArgs'
      responses:
        '200':
          description: The new item in the list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfCategorizedListItemViewModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
components:
  schemas:
    Sort:
      description: Sort options. Multiple sort options can be provided in the query string.
      required:
      - name
      - direction
      properties:
        direction:
          $ref: '#/components/schemas/SortDirection'
        name:
          description: Sort field name
          type: string
        priority:
          description: Priority index. Sorts with lower values are executed earlier
          type: integer
          format: int32
      type: object
    UpdateFieldValueOfBoolean:
      description: Active
      properties:
        dirty:
          description: Dirty
          type: boolean
        value:
          description: Value
          type: boolean
      type: object
    CategorizedListAuditModel:
      description: Query results
      properties:
        action:
          description: Action
          type: string
        categorizedListAuditId:
          description: CategorizedListAuditId
          type: integer
          format: int32
        categorizedListId:
          description: CategorizedListId
          type: string
          format: uuid
        databaseName:
          description: DatabaseName
          type: string
        dateRecorded:
          description: DateRecorded
          type: string
          format: date-time
        delegatedUserId:
          description: DelegatedUserId
          type: integer
          format: int32
          nullable: true
        delegatedUserName:
          description: DelegatedUserName
          type: string
        displayName:
          description: DisplayName
          type: string
        formattedDate:
          description: FormattedDate
          type: string
        ipAddress:
          description: IpAddress
          type: string
        machineName:
          description: MachineName
          type: string
        notes:
          description: Notes
          type: string
        userId:
          description: UserId
          type: integer
          format: int32
        userName:
          description: UserName
          type: string
      type: object
    CategorizedListDeleteModel:
      description: CategorizedListDeleteModel
      properties:
        id:
          description: Id
          type: string
