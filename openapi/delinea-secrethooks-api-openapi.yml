openapi: 3.0.0
info:
  title: Secret Server Rest Activations SecretHooks API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: SecretHooks
  description: View and maintain Secret hooks
paths:
  /v1/secret-detail/{secretId}/hook/{secretHookId}:
    put:
      tags:
      - SecretHooks
      summary: Update Secret Hook
      description: Update Secret hook
      operationId: SecretHooksService_UpdateHook
      parameters:
      - name: secretHookId
        in: path
        description: secretHookId
        required: true
        schema:
          type: integer
          format: int32
      - name: secretId
        in: path
        description: secretId
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        $ref: '#/components/requestBodies/SecretDetailHookUpdateArgs'
      responses:
        '200':
          description: Secret hook retrieved after updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretDetailHookModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    delete:
      tags:
      - SecretHooks
      summary: Delete Secret Hook
      description: Delete Secret Hook
      operationId: SecretHooksService_DeleteHook
      parameters:
      - name: secretHookId
        in: path
        description: secretHookId
        required: true
        schema:
          type: integer
          format: int32
      - name: secretId
        in: path
        description: secretId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success or failure
          content:
            application/json:
              schema:
                description: Boolean
                type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/secret-detail/{secretId}/hooks:
    get:
      tags:
      - SecretHooks
      summary: Get Secret Hooks
      description: Get all of the hooks for the specified secret
      operationId: SecretHooksService_GetHooks
      parameters:
      - name: secretId
        in: path
        description: secretId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A collection
          content:
            application/json:
              schema:
                description: A collection
                items:
                  $ref: '#/components/schemas/SecretDetailHookSummaryViewModel'
