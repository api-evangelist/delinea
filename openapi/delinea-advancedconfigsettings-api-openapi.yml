openapi: 3.0.0
info:
  title: Secret Server Rest Activations AdvancedConfigSettings API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: AdvancedConfigSettings
  description: AdvancedConfigSettingsController
paths:
  /v1/advanced-config-settings/{id}:
    delete:
      tags:
      - AdvancedConfigSettings
      summary: Delete advanced configuration setting
      description: Support only - Remove a specific advanced configuration setting
      operationId: AdvancedConfigSettingsService_Delete
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Result of the delete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/advanced-config-settings:
    get:
      tags:
      - AdvancedConfigSettings
      summary: Get advanced config settings
      description: Support only - Return all of the advanced configuration settings
      operationId: AdvancedConfigSettingsService_Get
      parameters:
      - name: filter.isCloud
        in: query
        description: Is Cloud
        required: false
        schema:
          type: boolean
      - name: filter.searchText
        in: query
        description: Search text
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A collection of all advanced configuration settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfConfigurationAdvancedSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    put:
      tags:
      - AdvancedConfigSettings
      summary: Update advanced configuration setting
      description: Support only - Update a single advanced configuration setting
      operationId: AdvancedConfigSettingsService_Put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationAdvancedUpdateArgs'
        description: args
      responses:
        '200':
          description: The setting that was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationAdvancedModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    post:
      tags:
      - AdvancedConfigSettings
      summary: Create advanced config setting
      description: Support only - Will create a an advanced configuration setting
      operationId: AdvancedConfigSettingsService_Post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationAdvancedCreateArgs'
        description: args
      responses:
        '200':
          description: The full configuration with the new setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationAdvancedModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
components:
  schemas:
    Sort:
      description: Sort options. Multiple sort options can be provided in the query string.
      required:
      - name
      - direction
      properties:
        direction:
          $ref: '#/components/schemas/SortDirection'
        name:
          description: Sort field name
          type: string
        priority:
          description: Priority index. Sorts with lower values are executed earlier
          type: integer
          format: int32
      type: object
    BadRequestResponse:
      description: Response object for invalid requests
      required:
      - message
      properties:
        message:
          description: Error message
          type: string
        messageDetail:
          description: Error message detail
          type: string
        errorCode:
          description: Error message code
          type: string
        modelState:
          description: An object describing validation errors
          type: object
      type: object
    DeletedModel:
      description: Information about an object that was deleted
      properties:
        id:
          description: ID of the deleted object
          type: integer
          format: int32
        objectType:
          description: Type of the deleted object
          type: string
        responseCodes:
          description: List of response codes from the delete operation
          items:
            type: string
          type: array
      type: object
    SortDirection:
      description: Sort direction
      properties: {}
      type: string
      enum:
      - None
      - Asc
      - Desc
    Severity:
      description: Error severity level
      properties: {}
      type: string
      enum:
      - None
      - Retry
      - Warn
      - Critical
      - Fatal
    ConfigurationAdvancedModel:
      description: ConfigurationAdvancedModel
      properties:
        advancedSettingId:
          description: AdvancedSettingId
          type: integer
          format: int32
        settingName:
          description: SettingName
          type: string
        value:
          description: Value
          type: string
      type: object
    InternalServerErrorResponse:
      description: Response object for internal server errors
      required:
      - message
      - exceptionMessage
      - exceptionType
      - stackTrace
      properties:
        message:
          description: Error message
          type: string
        exceptionMessage:
          description: Error message from exception
          type: string
        exceptionType:
          description: Exception type
          type: string
        stackTrace:
          description: Exception stack trace
          type: string
      type: object
    PagingOfConfigurationAdvancedSummary:
      description: Specify paging and sorting options for querying records and returning results
      properties:
        batchCount:
          description: Number of result batches available with current query options
          type: integer
          format: int32
        currentPage:
          description: Index of current result page
          type: integer
          format: int32
        hasNext:
          description: Whether there are any results in additional pages
          type: boolean
        hasPrev:
          description: Whether there are any results in previous pages
          type: boolean
        nextSkip:
          description: Correct value of 'skip' for the next page of results
          type: integer
          format: int32
        pageCount:
          description: Number of result pages available with current query options
          type: integer
          format: int32
        prevSkip:
          description: Correct value of 'skip' for the previous page of results
          type: integer
          format: int32
        records:
          description: Query results
          items:
            $ref: '#/components/schemas/ConfigurationAdvancedSummary'
          type: array
        severity:
          $ref: '#/components/schemas/Severity'
        skip:
          description: Number of records to skip before taking results
          type: integer
          format: int32
        sortBy:
          description: List of sort properties
          items:
            $ref: '#/components/schemas/Sort'
          type: array
        success:
          description: Whether the query executed successfully
          type: boolean
        take:
          description: Maximum number of records to include in results
          type: integer
          format: int32
        total:
          description: Total number of results available
          type: integer
          format: int32
      type: object
    AuthenticationFailedResponse:
      description: Response object for authentication failures
      required:
      - message
      properties:
        message:
          description: Error message
          type: string
      type: object
    ConfigurationAdvancedCreateArgs:
      description: Advanced Configuration Setting create options
      required:
      - advancedSettingId
      - value
      properties:
        advancedSettingId:
          description: Advanced Configuration Setting Id
          type: integer
          format: int32
        value:
          description: Advanced Configuration Setting Value
          type: string
      type: object
    ConfigurationAdvancedUpdateArgs:
      description: ConfigurationAdvancedUpdateArgs
      required:
      - advancedSettingId
      properties:
        advancedSettingId:
          description: Setting Id
          type: integer
          format: int32
        value:
          description: Setting Value
          type: string
      type: object
    ConfigurationAdvancedSummary:
      description: Advanced Configuration Setting Summary
      properties:
        advancedSettingId:
          description: Advanced Setting Id
          type: integer
          format: int32
        settingName:
          description: Advanced Setting Name
          type: string
        typeName:
          description: Type Name
          type: string
        value:
          description: Advanced Setting Value
          type: string
      type: object
  securitySchemes:
    BearerToken:
      type: apiKey
      description: 'Perform a POST request to `/oauth2/token`. It should include three form data parameters - `username`, `password`, and `grant_type`.The `grant_type` parameter should always have the value `password`.The access token returned should be included in the header of subsequent requests, like ''Authorization: Bearer <em>token</em>''. The token remains valid for a time period returned in the ''expires_in'' property (in seconds). For details, see the <a href="../OAuth/">token request documentation</a>.'
      name: Authorization
      in: header
