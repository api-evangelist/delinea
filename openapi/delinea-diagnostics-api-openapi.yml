      deprecated: false
  /v1/diagnostics/heartbeat-logs:
    get:
      tags:
      - Diagnostics
      summary: Get Heartbeat Logs
      description: Get Heartbeat Logs
      operationId: DiagnosticsService_GetHeartbeatLogs
      responses:
        '200':
          description: Get Heartbeat Logs
          content:
            application/json:
              schema:
                description: String
