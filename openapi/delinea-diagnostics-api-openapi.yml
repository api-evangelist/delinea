        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/diagnostics/quartz-jobs:
    get:
      tags:
      - Diagnostics
      summary: Get Quartz Jobs
      description: Get Quartz Jobs
      operationId: DiagnosticsService_GetQuartzJobs
      responses:
        '200':
          description: Enumerable of Quartz Jobs
          content:
            application/json:
              schema:
                description: Enumerable of Quartz Jobs
                items:
                  $ref: '#/components/schemas/QuartzTrigger'
                type: array
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/diagnostics/general-logs:
    get:
      tags:
