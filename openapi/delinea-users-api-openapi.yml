  /v1/users:
    get:
      tags:
      - Users
      summary: Search Users
      description: Search, filter, sort, and page users
      operationId: UsersService_SearchUsers
      parameters:
      - name: filter.domainId
        in: query
        description: If not null, filters users by Active Directory domain.
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.excludeInboxRuleIdSubscribers
        in: query
        description: When set all subscribers not subscribed directly to this inbox notification rule will be excluded.
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.includeInactive
        in: query
        description: Whether to include inactive users in the results.
        required: false
        schema:
          type: boolean
      - name: filter.searchFields
        in: query
        description: User fields to search.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: filter.searchText
        in: query
        description: The text to match in the username, display name, or email address.
        required: false
        schema:
          type: string
      - name: filter.userIds
        in: query
        description: User Ids to search.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: User search result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfUserSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    post:
      tags:
      - Users
      summary: Create User
      description: Create a new user
      operationId: UsersService_CreateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateArgs'
        description: User creation options
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
