openapi: 3.0.0
info:
  title: Secret Server Rest Activations LauncherAgents API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: LauncherAgents
  description: Manage Launcher Agents and Launcher Agent Collections for Advanced Session Recording
paths:
  /v1/launcheragents/collections:
    get:
      tags:
      - LauncherAgents
      summary: Search Launcher Agent Collections
      description: Search, filter, sort, and page Launcher Agent Collections
      operationId: LauncherAgentsService_SearchCollections
      parameters:
      - name: filter.includeInactive
        in: query
        description: Whether to include inactive Launcher Agent Collections in the results
        required: false
        schema:
          type: boolean
      - name: filter.searchText
        in: query
        description: Search text
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Launcher Agent Collection search result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfLauncherAgentCollectionSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    post:
      tags:
      - LauncherAgents
      summary: Create Launcher Agent Collection
      description: Create a new Launcher Agent Collection
      operationId: LauncherAgentsService_CreateCollection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LauncherAgentCollectionCreateArgs'
        description: Launcher Agent Collection creation options
      responses:
        '200':
          description: Launcher Agent Collection object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LauncherAgentCollectionModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents/collections/stub:
    get:
      tags:
      - LauncherAgents
      summary: Get Launcher Agent Collection Stub
      description: Return the default values for a new Launcher Agent Collection
      operationId: LauncherAgentsService_Stub
      parameters:
      - name: includeInactive
        in: query
        description: IncludeInactive
        required: false
        schema:
          type: boolean
      - name: searchText
        in: query
        description: SearchText
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Launcher Agent Collection object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LauncherAgentCollectionModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents/collections/{id}:
    get:
      tags:
      - LauncherAgents
      summary: Get Launcher Agent Collection
      description: Get a single Launcher Agent Collection by ID
      operationId: LauncherAgentsService_GetByCollectionId
      parameters:
      - name: includeInactive
        in: query
        description: Whether to include inactive Launcher Agent Collections in the results
        required: false
        schema:
          type: boolean
      - name: id
        in: path
        description: Launcher Agent Collection ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: LauncherAgentCollection object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LauncherAgentCollectionModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    put:
      tags:
      - LauncherAgents
      summary: Update Launcher Agent Collection
      description: Update a single Launcher Agent Collection by ID
      operationId: LauncherAgentsService_UpdateCollection
      parameters:
      - name: id
        in: path
        description: Launcher Agent Collection ID
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LauncherAgentCollectionUpdateArgs'
        description: Launcher Agent Collection update options
      responses:
        '200':
          description: Launcher Agent Collection object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LauncherAgentCollectionModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents/collections/audit:
    get:
      tags:
      - LauncherAgents
      summary: Get collections audit
      description: Return audit entries for all collections
      operationId: LauncherAgentsService_GetCollectionsAudit
      parameters:
      - name: isExporting
        in: path
        description: isExporting
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Launcher collection audit
          content:
            application/json:
              schema:
                description: Launcher collection audit
                items:
                  $ref: '#/components/schemas/LauncherAgentCollectionAudit'
                type: array
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents/collections/{id}/audit:
    get:
      tags:
      - LauncherAgents
      summary: Get collection audit
      description: Return audit entries for a single collection
      operationId: LauncherAgentsService_GetCollectionAudit
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      - name: isExporting
        in: path
        description: isExporting
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Launcher collection audit
          content:
            application/json:
              schema:
                description: Launcher collection audit
                items:
                  $ref: '#/components/schemas/LauncherAgentCollectionAudit'
                type: array
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents/issues:
    get:
      tags:
      - LauncherAgents
      summary: Search Launcher Agents with Issues
      description: Search, filter, sort, and page Launcher Agent with issues
      operationId: LauncherAgentsService_SearchAgentsWithIssues
      parameters:
      - name: filter.launcherAgentCollectionId
        in: query
        description: LauncherAgentCollectionId
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.searchText
        in: query
        description: SearchText
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Launcher Agent search result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfLauncherAgentSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents/configuration-state:
    get:
      tags:
      - LauncherAgents
      summary: Get Launcher Agent configuration state
      description: Get all launcher agent  configuration state
      operationId: LauncherAgentsService_GetLauncherAgentState
      responses:
        '200':
          description: LauncherAgentConfigurationState object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LauncherAgentConfigurationState'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents:
    get:
      tags:
      - LauncherAgents
      summary: Search Launcher Agents
      description: Search, filter, sort, and page Launcher Agent s
      operationId: LauncherAgentsService_Search
      parameters:
      - name: filter.includeInactive
        in: query
        description: IncludeInactive
        required: false
        schema:
          type: boolean
      - name: filter.launcherAgentCollectionId
        in: query
        description: LauncherAgentCollectionId
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.outOfDate
        in: query
        description: OutOfDate
        required: false
        x-nullable: true
        schema:
          type: boolean
      - name: filter.searchText
        in: query
        description: SearchText
        required: false
        schema:
          type: string
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Launcher Agent  search result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfLauncherAgentSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/launcheragents/{id}:
    get:
      tags:
      - LauncherAgents
      summary: 'Get Launcher Agent '
      description: Get a single Launcher Agent  by ID
      operationId: LauncherAgentsService_Get
      parameters:
      - name: includeInactive
        in: query
        description: Whether to include inactive Launcher Agents in the results
        required: false
        schema:
          type: boolean
      - name: id
        in: path
        description: Launcher Agent ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: LauncherAgent object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LauncherAgentModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
