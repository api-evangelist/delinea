  /v1/launcheragents/{id}/audit:
    get:
      tags:
      - LauncherAgents
      summary: Get Launcher Agent Audits by agent ID
      description: Get launcher agent audits by agent ID
      operationId: LauncherAgentsService_GetAuditsByAgentId
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      - name: isExporting
        in: path
        description: isExporting
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: LauncherAgentAudit object
          content:
            application/json:
              schema:
                description: LauncherAgentAudit object
                items:
                  $ref: '#/components/schemas/LauncherAgentAudit'
                type: array
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
