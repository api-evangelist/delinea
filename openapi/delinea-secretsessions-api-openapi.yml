openapi: 3.0.0
info:
  title: Secret Server Rest Activations SecretSessions API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: SecretSessions
  description: View recorded sessions
paths:
  /v1/recorded-sessions/ssh-session:
    get:
      tags:
      - SecretSessions
      summary: Get the SSH proxy session data
      description: Get the SSH proxy session data
      operationId: SecretSessionsService_GetSshProxyData
      parameters:
      - name: auditSecretId
        in: query
        description: Either the secret session ID or the secret audit record ID or secret session key must be passed
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: byteLimit
        in: query
        description: Amout of data in bytes to return
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int64
      - name: filterType
        in: query
        description: Filter by server, client, or both
        required: false
        schema:
          type: string
      - name: searchTerm
        in: query
        description: Search term to filter
        required: false
        schema:
          type: string
      - name: secretSessionId
        in: query
        description: Either the secret session ID, the secret audit record ID, secret session key, or the session GUID must be passed
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: secretSessionKey
        in: query
        description: Either the secret session ID, the secret audit record ID, secret session key, or the session GUID must be passed
        required: false
        schema:
          type: string
      - name: sessionGuid
        in: query
        description: This can be the secret session key or the launcher guid Either the secret session ID, the secret audit record ID, secret session key, or the session GUID must be passed
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SSH Proxy Session Data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshProxyDataSearchViewModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/recorded-sessions/ssh-session-file:
    get:
      tags:
      - SecretSessions
      summary: Get the SSH proxy session data as an attached file
      description: Get the SSH proxy session data as an attached file
      operationId: SecretSessionsService_GetSshProxyDataAsFile
      parameters:
      - name: auditSecretId
        in: query
        description: Either the secret session ID or the secret audit record ID or secret session key must be passed
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filterType
        in: query
        description: Filter by server, client, or both
        required: false
        schema:
          type: string
      - name: searchTerm
        in: query
        description: Search term to filter
        required: false
        schema:
          type: string
      - name: secretSessionId
        in: query
        description: Either the secret session ID, the secret audit record ID, secret session key, or the session GUID must be passed
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: secretSessionKey
        in: query
        description: Either the secret session ID, the secret audit record ID, secret session key, or the session GUID must be passed
        required: false
        schema:
          type: string
      - name: sessionGuid
        in: query
        description: This can be the secret session key or the launcher guid Either the secret session ID, the secret audit record ID, secret session key, or the session GUID must be passed
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SSH Proxy Session Data as an attached file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamContentResult'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/secret-sessions/{id}/summary:
    get:
      tags:
      - SecretSessions
      summary: Get a summary of the secret session data
      description: Get a summary of the secret session data
      operationId: SecretSessionsService_GetSecretSessionBySecretSessionId
      parameters:
      - name: id
        in: path
        description: id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Secret Session Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretSessionSummaryModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/recorded-sessions:
    get:
      tags:
      - SecretSessions
      summary: Search Recorded Sessions
      description: Search, filter, sort, and page recorded sessions
      operationId: SecretSessionsService_SearchSessions
      parameters:
      - name: filter.active
        in: query
        description: Filter by active or inactive status
        required: false
        x-nullable: true
        schema:
          type: boolean
      - name: filter.dateRange
        in: query
        description: Return sessions within a certain number of days
        required: false
        x-nullable: true
        schema:
          type: string
          format: time-span
      - name: filter.endDate
        in: query
        description: EndDate
        required: false
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: filter.endTime
        in: query
        description: EndTime
        required: false
        schema:
          type: string
      - name: filter.excludedApplications
        in: query
        description: Exclude particular Applications from search
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: filter.folderId
        in: query
        description: Filter by folder
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.groupIds
        in: query
        description: Return sessions for specific groups
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filter.hasError
        in: query
        description: Filter to only records with errors
        required: false
        x-nullable: true
        schema:
          type: boolean
      - name: filter.includeNonSecretServerSessions
        in: query
        description: IncludeNonSecretServerSessions
        required: false
        x-nullable: true
        schema:
          type: boolean
      - name: filter.includeOnlyLaunchedSuccessfully
        in: query
        description: Return only sessions that launched successfully
        required: false
        x-nullable: true
        schema:
          type: boolean
      - name: filter.includeRestricted
        in: query
        description: Whether to include restricted secret sessions
        required: false
        schema:
          type: boolean
      - name: filter.includeSubFolders
        in: query
        description: Whether to include subfolders in a folder search
        required: false
        schema:
          type: boolean
      - name: filter.launcherTypeId
        in: query
        description: Filter by launcher type
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.searchText
        in: query
        description: Search text
        required: false
        schema:
          type: string
      - name: filter.searchTypes
        in: query
        description: Specifies the sources of information you want to search across, can be many of (SecretItems, Username, Hostname, Domain, RdpKeystroke, RdpApplication, ProxyClient)
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: filter.secretIds
        in: query
        description: Return sessions for specific secrets
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: filter.siteId
        in: query
        description: SiteId
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.startDate
        in: query
        description: StartDate
        required: false
        x-nullable: true
        schema:
          type: string
          format: date-time
      - name: filter.startTime
        in: query
        description: StartTime
        required: false
        schema:
          type: string
      - name: filter.userIds
        in: query
        description: Return sessions for specific users
        required: false
        explode: true
        schema:
          type: array
          items:
            type: integer
      - name: skip
        in: query
        description: Number of records to skip before taking results
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy[0].direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
      - name: sortBy[0].name
        in: query
        description: Sort field name
        required: false
        schema:
          type: string
      - name: sortBy[0].priority
        in: query
        description: Priority index. Sorts with lower values are executed earlier
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Maximum number of records to include in results
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Recorded session search result object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagingOfSecretSessionSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v1/recorded-sessions/{id}:
