components:
  schemas:
    Sort:
      description: Sort options. Multiple sort options can be provided in the query string.
      required:
      - name
      - direction
      properties:
        direction:
          $ref: '#/components/schemas/SortDirection'
        name:
          description: Sort field name
          type: string
        priority:
          description: Priority index. Sorts with lower values are executed earlier
          type: integer
          format: int32
      type: object
    InboxRuleCopyModel:
      description: Inbox Rule Copy Model
      properties:
        inboxRuleIdToCopy:
          description: InboxRuleId To Copy
          type: integer
          format: int32
        name:
          description: Name
          type: string
      type: object
    UpdateFieldValueOfBoolean:
      description: Active
      properties:
        dirty:
          description: Dirty
          type: boolean
        value:
          description: Value
          type: boolean
      type: object
    InboxRuleCreateArgs:
      description: InboxRuleCreateArgs
      properties:
        data:
          $ref: '#/components/schemas/InboxRuleCreateModel'
      type: object
    InboxRuleConditionCreateModel:
      description: InboxRuleConditionCreateModel
      properties:
        displayValue:
          description: Display Value
          type: string
        inboxDataId:
          description: Inbox Data
          type: integer
          format: int32
        inboxRuleId:
          description: Inbox Rule
          type: integer
          format: int32
        inboxRuleOperand:
          $ref: '#/components/schemas/InboxRuleConditionOperand'
        valueBool:
          description: Boolean Value
          type: boolean
          nullable: true
        valueDateTime:
          description: DateTime Value
          type: string
          format: date-time
          nullable: true
        valueInt:
          description: Integer Value
          type: integer
          format: int32
          nullable: true
        valueString:
          description: String Value
          type: string
      type: object
    InboxRuleSubscriberEmailUpdate:
      description: Change the subscription for a specific email
      properties:
        emailAddress:
          description: A specific email address to add / remove.
          type: string
        subscribe:
          description: Passing true will subscribe this email address, passing false will remove this email address along with any rule action history
          type: boolean
      type: object
    SortDirection:
      description: Sort direction
      properties: {}
      type: string
      enum:
      - None
      - Asc
      - Desc
    InboxRuleDetailModel:
      description: InboxRuleDetailModel
      properties:
        active:
          description: Active
          type: boolean
        canEditOwnSubscription:
          description: Can Edit Own Subscription
          type: boolean
        conditions:
          description: Conditions
          items:
            $ref: '#/components/schemas/InboxRuleConditionSummary'
          type: array
        createdByUserId:
          description: Created By User Id
          type: integer
          format: int32
        highPriority:
          description: High Priority
