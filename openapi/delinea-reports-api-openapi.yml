openapi: 3.0.0
info:
  title: Secret Server Rest Activations Reports API
  description: REST API documentation for Secret Server. This document describes how to use the REST API. All requests require an authentication token; please see the <a href="../OAuth/">authentication document</a> for more information. The <a href="swagger.json">Swagger specification</a> for this API is also available.
  termsOfService: https://delinea.com/eula
  contact:
    name: Support
    url: https://delinea.com
  version: 11.7.2
servers:
- url: /SecretServer/api
security:
- BearerToken: []
tags:
- name: Reports
  description: View and maintain Reports
paths:
  /v1/reports/{id}:
    get:
      tags:
      - Reports
      summary: Get Report
      description: Gets a Report and returns the Report Model
      operationId: ReportsService_GetReportDetail
      parameters:
      - name: id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Report object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    put:
      tags:
      - Reports
      summary: Update Report
      description: Updates a Report and returns the report
      operationId: ReportsService_UpdateReport
      parameters:
      - name: id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUpdateArgs'
        description: Report update options
      responses:
        '200':
          description: Report object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportModel'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
    delete:
      tags:
      - Reports
      summary: Delete Report
      description: Delete a report by ID
      operationId: ReportsService_Delete
      parameters:
      - name: id
        in: path
        description: Report ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Object deletion result
          content:
            application/json:
              schema:
                description: Boolean
                type: boolean
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '403':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationFailedResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorResponse'
      deprecated: false
  /v2/reports/{id}:
