        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
      - name: filter.includeInactive
        in: query
        description: Whether to include inactive Reports in the results
        required: false
        schema:
          type: boolean
      - name: filter.reportName
        in: query
