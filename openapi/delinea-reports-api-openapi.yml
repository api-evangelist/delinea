      deprecated: false
    patch:
      tags:
      - Reports
      summary: Update Report Category
      description: Update Report Category
      operationId: ReportsService_UpdateReportCategory
      parameters:
      - name: reportCategoryId
        in: path
        description: reportCategoryId
