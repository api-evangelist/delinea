  name: Secret Server REST API
  description: >-
    REST API for Delinea Secret Server enabling programmatic management of privileged credentials, secrets,
    folders, permissions, and session recording. Supports Bearer token, OAuth 2.0, and Windows Integrated
    Authentication.
